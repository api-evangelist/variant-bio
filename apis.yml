aid: variant-bio
name: Variant Bio
description: Variant Bio is a biotechnology company developing life-saving therapies by studying
  the genes of people with exceptional health-related traits. Working with partner communities
  around the world under an ethical, benefit-sharing approach, the company pairs large-scale
  genomic discovery with data science to turn genetic diversity into novel drug targets across
  metabolic, cardiovascular and other disease areas. Surfaced as a portfolio company of
  General Catalyst, Lux Capital and SoftBank Vision Fund and profiled in the API Evangelist
  network; Variant Bio publishes no public developer/API surface at this time.
